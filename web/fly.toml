# fly.io free deploy of the Vela signaling server.
#   1) install flyctl + `fly auth login`
#   2) `fly launch --copy-config --no-deploy` (pick a unique app name)
#   3) `fly deploy`
# fly terminates TLS at its edge and forwards to the app on internal_port, so the
# browser gets HTTPS (camera/mic work) while the app runs plain HTTP.
app = "vela-meet"            # change to a globally-unique name
primary_region = "iad"       # pick the region nearest you

[build]

[env]
  PLAIN_HTTP = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
